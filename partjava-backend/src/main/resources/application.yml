server:
  port: 8080

spring:
  application:
    name: partjava-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Database Connection（凭据通过环境变量注入，模板见 partjavadata/secrets）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:partjava_notes}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf-8
    username: "${DB_USER:root}"
    password: "${DB_PASSWORD:}"
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  # Redis Connection
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: -1ms

# MyBatis-Plus Configuration
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.partjava.entity
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 生产环境注释掉

# Springdoc Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

# JWT 认证（密钥必须通过 JWT_SECRET 环境变量注入；未配置时启动会生成随机密钥并告警，重启后登录态失效）
jwt:
  secret: "${JWT_SECRET:}"
  expiration: 86400000

# 第三方及 AI 沙箱集成配置（密钥全部通过环境变量注入）
judge0:
  api-key: "${JUDGE0_API_KEY:}"
  api-host: "${JUDGE0_API_HOST:judge0-ce.p.rapidapi.com}"

ai:
  api-key: "${AI_API_KEY:}"
  api-url: "${AI_API_URL:https://api.deepseek.com/v1}"

